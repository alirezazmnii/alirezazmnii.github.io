  --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-float: 0 24px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  --topbar-bg: rgba(10,15,28,.22);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: #0c1226;
  color: var(--ink);
  min-height: 100vh;
  transition: background .25s ease, color .25s ease;
}
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }

/* ====== پس‌زمینه‌ی انیمیشنی ====== */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.55), transparent 62%),
    radial-gradient(680px 540px at 106% 6%, rgba(124,92,224,.4), transparent 62%),
    radial-gradient(700px 560px at 88% 102%, rgba(255,105,170,.32), transparent 62%),
    radial-gradient(640px 520px at 4% 104%, rgba(31,169,113,.3), transparent 62%),
    linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
  background-attachment: fixed;
  animation: glow-shift 24s ease-in-out infinite;
}
html[data-theme="dark"] .bg-glow {
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.32), transparent 60%),
    radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.28), transparent 60%),
    radial-gradient(700px 560px at 88% 102%, rgba(156,135,240,.26), transparent 60%),
    radial-gradient(640px 520px at 4% 104%, rgba(52,201,140,.2), transparent 60%),
    linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
  background-attachment: fixed;
}
@keyframes glow-shift {
  0%, 100% { filter: saturate(1) hue-rotate(0deg); }
  50% { filter: saturate(1.18) hue-rotate(10deg); }
}
@media (prefers-reduced-motion: reduce) { .bg-glow { animation: none; } }

.theme-toggle {
  position: fixed; bottom: 16px; left: 16px; z-index: 9999;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink); font-size: 17px;
  transition: background .25s ease, border-color .25s ease, transform .15s ease;
}
.theme-toggle:hover { transform: translateY(-1px); }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

/* ---------- Login screen ---------- */
#login-screen {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.login-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 380px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 44px 36px 36px;
  box-shadow: var(--shadow-float);
  text-align: center;
  animation: rise .5s cubic-bezier(.2,.8,.2,1);
}
@media (max-width: 420px) { .login-card { padding: 36px 22px 28px; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.login-card h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.login-card p.subtitle { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 28px; }
.field { margin-bottom: 16px; text-align: right; }
.field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 7px; }
.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--surface-tint);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  backdrop-filter: blur(12px) saturate(160%);
  box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink);
  outline: none;
  direction: ltr;
  text-align: right;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.field input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
button { font-family: var(--font); cursor: pointer; }
button.primary {
  width: 100%;
  padding: 13px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(23,169,255,.85) 0%, rgba(22,86,245,.85) 100%);
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  margin-top: 8px;
  box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .15s, box-shadow .15s, filter .15s;
}
button.primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
button.primary:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; }
.login-error {
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 13px; font-weight: 500;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  text-align: right;
}

/* ---------- App shell ---------- */
#app-screen { position: relative; z-index: 1; min-height: 100vh; }
.topbar-wrap { position: sticky; top: 0; z-index: 10; }
header.topbar {
  background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
@media (max-width: 560px) { header.topbar { padding: 12px 16px; } }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 16px -6px rgba(22,86,245,.5);
}
.user-name { font-weight: 700; font-size: 14px; }
.role-badge {
  display: inline-block;
  background: var(--accent-soft); color: var(--accent-strong);
  font-weight: 600; font-size: 11.5px;
  padding: 2px 10px; border-radius: 999px; margin-top: 3px;
}
.user-group-info { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
.topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.sync-note { font-size: 12px; color: var(--ink-faint); }
button.ghost {
  background: none; border: none;
  color: var(--ink-soft); font-size: 13px; padding: 0;
  transition: color .15s;
}
button.ghost:hover { color: var(--danger); }

main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 24px 60px; }
@media (max-width: 560px) { main { padding: 20px 16px 60px; } }

/* ---------- Summary cards ---------- */
.summary-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.summary-card {
  background: linear-gradient(135deg, rgba(22,86,245,.62) 0%, rgba(23,169,255,.62) 100%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  flex: 1; min-width: 160px;
  box-shadow: 0 16px 34px -16px rgba(22,86,245,.5), inset 0 1px 0 rgba(255,255,255,.45);
  position: relative; overflow: hidden;
}
.summary-card::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(140px 140px at 90% 0%, rgba(255,255,255,.25), transparent 70%);
}
.summary-card .label { font-size: 13px; color: rgba(255,255,255,.9); margin-bottom: 6px; font-weight: 600; position: relative; }
.summary-card .value { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.01em; position: relative; }
.summary-card .value.salary { color: #CFFFE6; }
.summary-card .sub { font-size: 12px; color: rgba(255,255,255,.85); margin-top: 4px; position: relative; }
.summary-card .value small { font-size: 14px; opacity: .85; font-weight: 700; }
.summary-card .value.date { font-size: 19px; }
.summary-card .unit { font-size: 13px; font-weight: 600; }

/* ---------- Panels / tables ---------- */
.panel {
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.panel.companies {
  padding: 16px 20px; text-align: center; margin-bottom: 20px;
  background: rgba(0,180,255,.12); border-color: rgba(0,180,255,.4);
}
.panel.companies .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
.panel.companies .names { font-weight: 700; font-size: 14.5px; }
table.rows { width: 100%; border-collapse: collapse; }
table.rows tr { transition: background .12s; }
table.rows tr:hover { background: var(--surface-tint); }
table.rows td { padding: 13px 20px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
table.rows tr:last-child td { border-bottom: none; }
table.rows td.num {
  text-align: left; direction: ltr;
  font-weight: 700; color: var(--accent-strong);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 4px 12px;
  display: inline-block;
  margin: 4px 0;
}
table.rows td.num.salary { color: var(--good); }
table.rows td.num-head { background: none; color: var(--ink-faint) !important; font-weight: 500; padding: 4px 12px; margin-inline-start: 6px; }
table.rows td.num + td.num { margin-inline-start: 6px; }
.empty-state { padding: 44px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* ---------- Org tree ---------- */
.tree-node { margin-bottom: 6px; }
.tree-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer; user-select: none;
  box-shadow: var(--shadow-card);
  transition: border-color .15s, transform .1s;
}
.tree-row:hover { border-color: var(--accent); transform: translateY(-1px); }
.tree-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tree-row .chevron {
  width: 14px; text-align: center; color: var(--ink-faint);
  font-size: 11px; transition: transform .25s cubic-bezier(.4,0,.2,1); flex-shrink: 0;
}
.tree-row.open .chevron { transform: rotate(90deg); color: var(--accent); }
.tree-row .leaf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.tree-row .name { font-weight: 700; font-size: 13.5px; flex-shrink: 0; }
.tree-row .tree-role {
  font-size: 11px; font-weight: 600; color: var(--accent-strong);
  background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  flex-shrink: 0;
}
.tree-row .spacer { flex: 1; }
.tree-row .tree-total { font-size: 13.5px; font-weight: 700; color: var(--ink); direction: ltr; }
.tree-row .tree-count { font-size: 11px; color: var(--ink-faint); }
.tree-search {
  width: 100%;
  background: var(--surface-tint);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  backdrop-filter: blur(12px) saturate(160%);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 11px 15px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 13.5px;
  margin-bottom: 18px;
  box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
}
.tree-search:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
select.tree-search option { color: #0F1B33; }
.filters { display: flex; gap: 10px; }
.filters .tree-search { flex: 1; }
.filters select.tree-search { max-width: 170px; flex: 0 0 auto; }
.section-label { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; font-weight: 500; }
.loading { color: var(--ink-faint); font-size: 13px; padding: 20px 0; }

.tree-row.clickable-leaf:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.leaf-detail table.rows {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 8px;
  background: var(--surface);
}
.tree-total-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.tree-total-group .tree-total.salary { color: var(--good); font-size: 12px; }

.tree-row.role-team_lead {
  background: linear-gradient(135deg, rgba(0,180,255,.16) 0%, rgba(0,180,255,.08) 100%);
  border-color: rgba(0,180,255,.45);
}
.tree-row.role-team_lead:hover { border-color: var(--accent); }
.tree-row.role-team_lead .tree-role { background: rgba(0,180,255,.28); color: var(--accent-strong); }

/* ---------- Logo / brand ---------- */
.login-bg-logo {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; overflow: hidden;
}
.login-bg-logo img { width: min(720px, 140vw); opacity: .10; filter: blur(.5px); }
html[data-theme="dark"] .login-bg-logo img { opacity: .14; }
.login-logo-top { display: flex; justify-content: center; margin-bottom: 20px; min-height: 40px; }
.login-logo-top img { height: 40px; width: auto; }
.wordmark { font-weight: 800; font-size: 20px; color: var(--accent-strong); letter-spacing: .01em; direction: ltr; }
.topbar-brand { display: flex; align-items: center; gap: 10px; padding-inline-end: 14px; margin-inline-end: 14px; border-inline-end: 1px solid var(--line); }
.topbar-brand img { height: 24px; width: auto; }
.topbar-brand .wordmark { font-size: 15px; }
@media (max-width: 560px) {
  .topbar-brand { border-inline-end: none; padding-inline-end: 0; margin-inline-end: 0; }
  .topbar-brand img { height: 20px; }
}

/* ---------- وضعیت فعال/غیرفعال ---------- */
.pulse-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 0 rgba(52,201,140,.55);
  animation: pulseDot 1.6s ease-out infinite;
  margin-inline-end: 7px; vertical-align: middle; flex-shrink: 0;
}
.pulse-dot.sm { width: 7px; height: 7px; }
@keyframes pulseDot {
  0%   { box-shadow: 0 0 0 0 rgba(52,201,140,.55); }
  70%  { box-shadow: 0 0 0 9px rgba(52,201,140,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,201,140,0); }
}
@media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none; } }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 0 2px var(--good-soft);
  background: var(--good);
}
.status-dot.inactive { background: #9CA3AF; box-shadow: 0 0 0 2px rgba(156,163,175,.22); }

.active-badge {
  font-size: 11px; font-weight: 700; color: var(--good);
  background: var(--good-soft); border-radius: 999px; padding: 2px 9px;
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.active-badge .status-dot { width: 6px; height: 6px; box-shadow: none; }

.today-count-badge {
  font-size: 11px; font-weight: 700; color: var(--accent-strong);
  background: var(--accent-soft); border-radius: 999px; padding: 2px 10px;
  flex-shrink: 0; white-space: nowrap;
}
.last-active-badge {
  font-size: 11px; font-weight: 600; color: var(--ink-soft);
  background: rgba(140,140,140,.14); border-radius: 999px; padding: 2px 10px;
  flex-shrink: 0; white-space: nowrap;
}

.company-stats-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 9px; margin-bottom: 18px;
}
.company-pill {
  display: inline-flex; align-items: center;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 12.5px; font-weight: 600;
  color: var(--ink-soft);
  box-shadow: var(--shadow-card);
}
.company-pill b { color: var(--good); margin-inline-start: 5px; font-size: 13px; }
.company-pill.tiny { padding: 5px 12px; font-size: 11.5px; }
.company-pill.tiny.inactive-companies { opacity: .55; filter: grayscale(60%); }
.company-stats-row .company-pill {
  justify-content: space-between;
  width: 118px; height: 34px; flex: 0 0 auto;
  background: rgba(0,180,255,.14);
  border-color: rgba(0,180,255,.4);
}
.company-stats-row .company-pill .company-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60px;
}
html[data-theme="dark"] .company-stats-row .company-pill { background: rgba(0,180,255,.10); }

.operator-status-badges { display: flex; gap: 8px; align-items: center; }
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600;
  border-radius: 999px; padding: 5px 11px;
  background: var(--good-soft); color: var(--good);
}
.status-pill.off { background: var(--danger-soft); color: var(--danger); }
.status-pill .status-dot { box-shadow: none; }

/* ---------- باز/بسته شدن روان ---------- */
.tree-children, .leaf-detail {
  display: grid;
  grid-template-rows: 0fr;
  margin-inline-start: 24px;
  padding-inline-start: 14px;
  border-inline-start: 1.5px dashed var(--line);
  margin-top: 0;
  transition: grid-template-rows .42s cubic-bezier(.4,0,.2,1), margin-top .42s ease, opacity .3s ease;
  opacity: 0;
}
@media (max-width: 560px) { .tree-children, .leaf-detail { margin-inline-start: 10px; padding-inline-start: 8px; } }
.tree-children.open, .leaf-detail.open { grid-template-rows: 1fr; margin-top: 6px; opacity: 1; }
.tree-children-inner, .leaf-detail-inner { overflow: hidden; min-height: 0; }
.leaf-detail-inner { padding: 4px 0 2px; }

@keyframes fadeInRow {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.tree-children-inner > .tree-node,
.leaf-detail-inner table.rows tr {
  animation: fadeInRow .32s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
@media (prefers-reduced-motion: reduce) {
  .tree-children-inner > .tree-node, .leaf-detail-inner table.rows tr { animation: none; }
}

/* ---------- نمودار دونات شرکت‌ها و روند صدور روزانه (نمای اپراتور) ---------- */
.panel.chart { padding: 20px; margin-bottom: 20px; }
.panel.chart > .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
.panel.donut-panel { text-align: center; padding: 22px 20px; }
.donut-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.donut {
  position: relative; width: 120px; height: 120px; border-radius: 50%;
  background: conic-gradient(var(--accent) 0 calc(var(--pct) * 1%), var(--surface-tint) 0 100%);
}
.donut-hole {
  position: absolute; inset: 14px; border-radius: 50%; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut-hole b { font-size: 20px; font-weight: 800; }
.donut-hole small { font-size: 11px; color: var(--ink-faint); }
.donut-info { text-align: right; max-width: 280px; }
.donut-info .updated { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
.donut-info .names { font-size: 13px; }
.trend svg { width: 100%; height: 160px; display: block; direction: ltr; }
.trend .trend-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.trend .trend-dot { fill: var(--accent-strong); }
.trend .trend-fill-top { stop-color: var(--accent); stop-opacity: .35; }
.trend .trend-fill-bottom { stop-color: var(--accent); stop-opacity: 0; }
.trend-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

</style>

<body>

<div class="bg-glow"></div>
<button class="theme-toggle" id="theme-toggle" type="button" title="تغییر پوسته" aria-label="تغییر پوسته">
  <span class="icon-moon" aria-hidden="true">🌙</span>
  <span class="icon-sun" aria-hidden="true">☀️</span>
</button>

<script>
'use strict';

// =====================================================================
// داشبورد عملکرد اپراتورها — منطق فرانت
// ---------------------------------------------------------------------
// همه‌ی کنترل دسترسی داخل Supabase (RLS) انجام می‌شه. این فایل فقط
// چیزی رو نمایش می‌ده که دیتابیس اجازه‌ی خوندنش رو به کاربر لاگین‌شده داده.
// =====================================================================

(function () {
  // ---------------------------------------------------------------
  // راه‌اندازی
  // ---------------------------------------------------------------
  const cfg = window.APP_CONFIG;
  const $ = (id) => document.getElementById(id);

  // تم
  $('theme-toggle').addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('dashboardTheme', next); } catch (e) {}
  });

  // اگه فایل لوگو موجود نبود، به‌جاش اسم برند رو به‌صورت متن نشون بده
  document.querySelectorAll('img.logo-img').forEach((img) => {
    img.addEventListener('error', () => {
      if (img.alt) {
        const span = document.createElement('span');
        span.className = 'wordmark';
        span.textContent = img.alt;
        img.replaceWith(span);
      } else {
        img.remove();
      }
    }, { once: true });
  });

  if (!window.supabase || !cfg) {
    showLoginError('بارگذاری کتابخانه‌ی Supabase ناموفق بود. اتصال اینترنت را بررسی و صفحه را دوباره بارگذاری کنید.');
    $('login-btn').disabled = true;
    return;
  }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  const ROLE_LABELS = {
    operator: 'اپراتور',
    team_lead: 'سرگروه',
    supervisor: 'سرپرست',
    manager: 'مدیر',
  };

  const RECENT_DAYS_LIMIT = 200;

  // سرگروه‌هایی که با هم یک «گروه» هستند (برای نمایش «گروه X و Y» در هدر اپراتورهای زیرشان)
  const TEAM_LEAD_GROUPS = [
    ['مهدی فراهانی', 'سرگروه ایران'],
    ['مهدی ایازی', 'فاطمه دهقانپور'],
    ['آتنا مالمیر', 'امیررضا فلاح'],
  ];

  function getGroupLabel(teamLeadName) {
    const grp = TEAM_LEAD_GROUPS.find((g) => g.includes(teamLeadName));
    if (!grp) return null;
    return 'گروه ' + grp.map((n) => n.trim().split(/\s+/)[0]).join(' و ');
  }

  // ---------------------------------------------------------------
  // ابزارهای کمکی
  // ---------------------------------------------------------------
  // جلوگیری از تزریق HTML: هر متنی که از دیتابیس میاد قبل از رفتن توی innerHTML escape می‌شه
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatNum(n) {
    return Number(n || 0).toLocaleString('fa-IR');
  }

  function splitCompanies(str) {
    return (str || '').split('،').map((s) => s.trim()).filter(Boolean);
  }

  function showLoginError(msg) {
    const box = $('login-error');
    box.textContent = msg;
    box.hidden = false;
  }

  // ---------------------------------------------------------------
  // تاریخ شمسی و بازه‌ی حقوق (۲۱ هر ماه تا ۲۰ ماه بعد)
  // ---------------------------------------------------------------
  function gregorianToJalali(gy, gm, gd) {
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy;
    if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
    let jm, jd;
    if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
    else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
    return [jy, jm, jd];
  }

  function getTodayJalali() {
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' });
    const [gy, gm, gd] = fmt.format(new Date()).split('-').map(Number);
    return gregorianToJalali(gy, gm, gd);
  }

  const PERSIAN_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

  function getCurrentPeriod() {
    const [jy, jm, jd] = getTodayJalali();
    let startY, startM, endY, endM;
    if (jd >= 21) {
      startY = jy; startM = jm;
      endM = jm + 1; endY = jy;
      if (endM > 12) { endM = 1; endY = jy + 1; }
    } else {
      endY = jy; endM = jm;
      startM = jm - 1; startY = jy;
      if (startM < 1) { startM = 12; startY = jy - 1; }
    }
    return {
      startSort: String(startY * 10000 + startM * 100 + 21),
      endSort: String(endY * 10000 + endM * 100 + 20),
      label: `${PERSIAN_MONTHS[endM - 1]} ماه`,
    };
  }

  const CURRENT_PERIOD = getCurrentPeriod();
  const TODAY = getTodayJalali();
  const TODAY_SORT = TODAY[0] * 10000 + TODAY[1] * 100 + TODAY[2];

  // ---------------------------------------------------------------
  // وضعیت برنامه
  // ---------------------------------------------------------------
  const state = {
    profile: null,
    viewerRole: null,
    visibleProfiles: [],
    profileById: {},
    childrenOf: {},
    targetsByOperator: {},
    rawTargetsByOperator: {},
    statusByOperator: {},
    subtreeTotal: {},
    subtreeSalary: {},
    activeCountBySubtree: {},
    search: '',
    companyFilter: '',
  };

  function isFullyActive(st) {
    return !!(st && st.is_active === true && st.is_active_to_issue === true);
  }

  // ---------------------------------------------------------------
  // ورود / خروج
  // ---------------------------------------------------------------
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = $('login-username').value.trim();
    const email = raw.includes('@') ? raw : `${raw}@${cfg.EMAIL_DOMAIN}`;
    const password = $('login-password').value;
    const btn = $('login-btn');
    $('login-error').hidden = true;
    btn.disabled = true;
    btn.textContent = 'در حال ورود...';

    let result;
    try {
      result = await sb.auth.signInWithPassword({ email, password });
    } catch (ex) {
      btn.disabled = false;
      btn.textContent = 'ورود';
      showLoginError('اتصال به سرور برقرار نشد. لطفاً دوباره تلاش کنید.');
      return;
    }

    btn.disabled = false;
    btn.textContent = 'ورود';

    if (result.error) {
      const msg = result.error.message || '';
      if (/invalid.*credentials/i.test(msg)) showLoginError('نام کاربری یا رمز عبور اشتباه است.');
      else if (/rate|too many/i.test(msg)) showLoginError('تعداد تلاش‌ها زیاد بود. چند دقیقه بعد دوباره امتحان کنید.');
      else showLoginError('ورود ناموفق بود. لطفاً دوباره تلاش کنید.');
      return;
    }

    $('login-password').value = '';
    await boot();
  });

  $('logout-btn').addEventListener('click', async () => {
    try { await sb.auth.signOut(); } catch (e) {}
    location.reload();
  });

  // اگه سشن از جای دیگه منقضی یا خارج شد، برگرد به صفحه‌ی ورود
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && state.profile) location.reload();
  });

  // ---------------------------------------------------------------
  // شروع برنامه بعد از لاگین
  // ---------------------------------------------------------------
  async function boot() {
    const { data: sessionData } = await sb.auth.getSession();
    if (!sessionData.session) return;

    $('login-screen').hidden = true;
    $('app-screen').hidden = false;

    const userId = sessionData.session.user.id;
    const { data: profile, error } = await sb
      .from('profiles')
      .select('id, full_name, role, reports_to')
      .eq('id', userId)
      .maybeSingle();

    if (error || !profile) {
      $('content-area').innerHTML = '<div class="empty-state">پروفایلی برای این حساب تعریف نشده است. با مدیر سیستم تماس بگیرید.</div>';
      return;
    }

    state.profile = profile;
    state.viewerRole = profile.role;
    // برای اپراتور، سرگروه مستقیمش هم خوانده می‌شه (برای «گروه ... · سرگروه: ...» در هدر).
    // اگه RLS اجازه‌ی خوندن پروفایل سرگروه رو نده، فقط این خط خالی می‌مونه.
    let manager = null;
    if (profile.role === 'operator' && profile.reports_to) {
      const { data: mgr } = await sb.from('profiles').select('id, full_name').eq('id', profile.reports_to).maybeSingle();
      manager = mgr || null;
    }

    renderTopbar(profile, manager);
    $('period-label').textContent = `دوره‌ی جاری: ${CURRENT_PERIOD.label}`;
    loadSyncStatus();

    if (profile.role === 'operator') await renderOperatorView(profile);
    else await renderManagerialView(profile);
  }

  function renderTopbar(profile, manager) {
    $('user-name').textContent = profile.full_name || '—';
    $('user-role').textContent = ROLE_LABELS[profile.role] || profile.role;
    $('user-avatar').textContent = (profile.full_name || '?').trim().charAt(0);
    let groupInfo = '';
    if (manager && manager.full_name) {
      const groupLabel = getGroupLabel(manager.full_name);
      groupInfo = groupLabel ? `${groupLabel} · سرگروه: ${manager.full_name}` : `سرگروه: ${manager.full_name}`;
    }
    $('user-group-info').textContent = groupInfo;
  }

  async function loadSyncStatus() {
    const { data } = await sb.from('sync_status').select('last_synced_at').eq('id', 1).maybeSingle();
    const note = $('sync-note');
    note.textContent = (data && data.last_synced_at)
      ? `آخرین به‌روزرسانی: ${new Date(data.last_synced_at).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })}`
      : '';
  }

  // ---------------------------------------------------------------
  // نمای اپراتور
  // ---------------------------------------------------------------
  async function renderOperatorView(profile) {
    const [{ data, error }, { data: ownStatus }] = await Promise.all([
      sb.from('daily_targets')
        .select('report_date_jalali, report_date_sort, target_count, daily_salary')
        .eq('operator_id', profile.id)
        .gte('report_date_sort', CURRENT_PERIOD.startSort)
        .lte('report_date_sort', CURRENT_PERIOD.endSort)
        .order('report_date_sort', { ascending: false })
        .limit(RECENT_DAYS_LIMIT),
      sb.from('issuer_active_status')
        .select('is_active, is_active_to_issue, companies, all_companies, updated_at')
        .eq('operator_id', profile.id)
        .maybeSingle(),
    ]);

    renderOperatorStatusBadges(ownStatus);
    const content = $('content-area');

    if (error) {
      content.innerHTML = '<div class="empty-state">خطا در دریافت اطلاعات. صفحه را دوباره بارگذاری کنید.</div>';
      return;
    }

    const rows = (data || []).slice()
      .sort((a, b) => (Number(b.report_date_sort) || 0) - (Number(a.report_date_sort) || 0));
    const total = rows.reduce((s, r) => s + (Number(r.target_count) || 0), 0);
    const totalSalary = rows.reduce((s, r) => s + (Number(r.daily_salary) || 0), 0);
    const last = rows[0]; // آخرین رکورد ثبت‌شده (نه لزوماً امروز)
    const todayCount = rows
      .filter((r) => Number(r.report_date_sort) === TODAY_SORT)
      .reduce((s, r) => s + (Number(r.target_count) || 0), 0);

    $('summary-row').innerHTML = `
      <div class="summary-card"><div class="label">جمع کل حقوق</div><div class="value salary">${formatNum(totalSalary)} <span class="unit">ریال</span></div></div>
      <div class="summary-card"><div class="label">جمع کل ثبت‌شده</div><div class="value">${formatNum(total)}</div></div>
      <div class="summary-card"><div class="label">صدور امروز</div><div class="value">${formatNum(todayCount)}</div></div>
      <div class="summary-card"><div class="label">تعداد روزهای فعالیت در ماه</div><div class="value">${formatNum(rows.length)}</div></div>
      <div class="summary-card"><div class="label">آخرین روز فعالیت</div><div class="value date">${last ? esc(last.report_date_jalali) : '—'}</div></div>
    `;

    const topHtml = renderCompaniesRow(ownStatus && ownStatus.companies) + renderCompanyDonut(ownStatus);

    if (rows.length === 0) {
      content.innerHTML = topHtml + '<div class="panel"><div class="empty-state">هنوز رکوردی برای شما ثبت نشده است</div></div>';
      return;
    }

    content.innerHTML = topHtml + renderDailyTrendChart(rows) + `
      <div class="tree-node">
        <div class="tree-row role-team_lead" id="month-card-toggle" tabindex="0" role="button" aria-expanded="false">
          <span class="chevron">◀</span>
          <span class="name">${esc(CURRENT_PERIOD.label)}</span>
          <span class="spacer"></span>
          <span class="tree-count">${formatNum(rows.length)} روز فعالیت</span>
        </div>
        <div class="tree-children" id="month-card-detail">
          <div class="tree-children-inner">${rowsTableHtml(rows, 'حقوق روز (ریال)')}</div>
        </div>
      </div>
    `;

    const toggle = $('month-card-toggle');
    const detail = $('month-card-detail');
    const flip = () => {
      const open = !detail.classList.contains('open');
      toggle.classList.toggle('open', open);
      detail.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
    };
    toggle.addEventListener('click', flip);
    toggle.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  }

  function rowsTableHtml(rows, salaryHeader = 'حقوق روز') {
    return `
      <table class="rows">
        <tr>
          <td class="num-head">تاریخ</td>
          <td class="num num-head">عملکرد</td>
          <td class="num num-head">${salaryHeader}</td>
        </tr>
        ${rows.map((r, i) => `
          <tr style="--i:${i}">
            <td>${esc(r.report_date_jalali)}</td>
            <td class="num">${r.target_count != null ? formatNum(r.target_count) : '—'}</td>
            <td class="num salary">${r.daily_salary != null ? formatNum(r.daily_salary) : '—'}</td>
          </tr>
        `).join('')}
      </table>
    `;
  }

  function renderOperatorStatusBadges(status) {
    const box = $('operator-status-badges');
    if (!status) { box.innerHTML = ''; return; }
    const adminOn = status.is_active === true;
    const selfOn = status.is_active_to_issue === true;
    box.innerHTML = `
      <span class="status-pill ${adminOn ? '' : 'off'}"><span class="status-dot ${adminOn ? '' : 'inactive'}"></span>${adminOn ? 'فعال' : 'غیرفعال'}</span>
      <span class="status-pill ${selfOn ? '' : 'off'}"><span class="status-dot ${selfOn ? '' : 'inactive'}"></span>${selfOn ? 'آنلاین' : 'آفلاین'}</span>
    `;
  }

  function renderCompaniesRow(companiesStr) {
    const names = splitCompanies(companiesStr);
    if (names.length === 0) return '';
    return `
      <div class="panel companies">
        <div class="label">شرکت‌های فعال</div>
        <div class="names">${names.map(esc).join('،  ')}</div>
      </div>
    `;
  }

  // نمودار دونات: چند شرکت از کل شرکت‌هایی که اپراتور تا حالا باهاشون کار کرده، الان فعاله
  // (تارگت‌ها به‌تفکیک شرکت ثبت نمی‌شن، پس مبنا وضعیت فعال/غیرفعال شرکت‌هاست، نه تعداد صدور هر شرکت)
  function renderCompanyDonut(status) {
    if (!status) return '';
    const activeNames = splitCompanies(status.companies);
    const allNames = splitCompanies(status.all_companies);
    const total = allNames.length || activeNames.length;
    if (total === 0) return '';
    const activeCount = activeNames.length;
    const pct = Math.round((activeCount / total) * 100);
    const updated = status.updated_at
      ? new Date(status.updated_at).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })
      : '—';
    return `
      <div class="panel chart donut-panel">
        <div class="label">شرکت‌های فعال از کل شرکت‌های همکاری‌شده</div>
        <div class="donut-wrap">
          <div class="donut" style="--pct:${pct}" role="img" aria-label="${pct} درصد فعال">
            <div class="donut-hole"><b>${formatNum(pct)}٪</b><small>${formatNum(activeCount)} از ${formatNum(total)}</small></div>
          </div>
          <div class="donut-info">
            <div class="updated">آخرین به‌روزرسانی: ${esc(updated)}</div>
            <div class="names">${activeNames.length ? activeNames.map(esc).join('،  ') : 'در حال حاضر فعال نیست'}</div>
          </div>
        </div>
      </div>
    `;
  }

  // نمودار خطی صدور روزانه در دوره‌ی جاری
  function renderDailyTrendChart(rows) {
    if (!rows || rows.length < 2) return '';
    const asc = rows.slice().sort((a, b) => (Number(a.report_date_sort) || 0) - (Number(b.report_date_sort) || 0));
    const values = asc.map((r) => Number(r.target_count) || 0);
    const max = Math.max(...values, 1);
    const min = Math.min(...values, 0);
    const w = 640, h = 160, padX = 12, padY = 16;
    const span = Math.max(max - min, 1);
    const stepX = (w - padX * 2) / (values.length - 1);
    const pts = values.map((v, i) => [padX + i * stepX, h - padY - ((v - min) / span) * (h - padY * 2)]);
    const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${h - padY} L${pts[0][0].toFixed(1)},${h - padY} Z`;
    return `
      <div class="panel chart trend">
        <div class="label">روند صدور روزانه در ${esc(CURRENT_PERIOD.label)}</div>
        <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="نمودار صدور روزانه">
          <defs>
            <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" class="trend-fill-top" />
              <stop offset="100%" class="trend-fill-bottom" />
            </linearGradient>
          </defs>
          <path d="${area}" fill="url(#trendFill)" />
          <path d="${line}" class="trend-line" />
          ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" class="trend-dot"><title>${esc(asc[i].report_date_jalali)}: ${formatNum(values[i])}</title></circle>`).join('')}
        </svg>
        <div class="trend-axis"><span>${esc(asc[0].report_date_jalali)}</span><span>${esc(asc[asc.length - 1].report_date_jalali)}</span></div>
      </div>
    `;
  }

  // ---------------------------------------------------------------
  // نمای مدیریتی (سرگروه / سرپرست / مدیر)
  // ---------------------------------------------------------------
  async function renderManagerialView(profile) {
    const content = $('content-area');
    content.innerHTML = '<div class="loading">در حال بارگذاری ساختار تیم...</div>';

    // هر سه کوئری توسط RLS به «خود کاربر + زیرمجموعه‌اش» محدود می‌شن
    const [profilesRes, targetsRes, statusRes, companyRes, scopeRes] = await Promise.all([
      sb.from('profiles').select('id, full_name, role, reports_to'),
      sb.from('daily_targets')
        .select('operator_id, report_date_jalali, report_date_sort, target_count, daily_salary')
        .gte('report_date_sort', CURRENT_PERIOD.startSort)
        .lte('report_date_sort', CURRENT_PERIOD.endSort)
        .order('report_date_sort', { ascending: false })
        .limit(10000),
      sb.from('issuer_active_status').select('operator_id, is_active, is_active_to_issue, status, companies, all_companies'),
      // آمار شرکت‌ها: RLS خودش تعیین می‌کنه چه شرکت‌هایی دیده بشه
      sb.from('company_active_status').select('company, active_count').order('active_count', { ascending: false }),
      profile.role === 'team_lead'
        ? sb.from('team_lead_company_scope').select('company, sort_order').eq('profile_id', profile.id).order('sort_order')
        : Promise.resolve({ data: null }),
    ]);

    if (profilesRes.error || targetsRes.error) {
      content.innerHTML = '<div class="empty-state">خطا در دریافت اطلاعات. صفحه را دوباره بارگذاری کنید.</div>';
      return;
    }

    // --- ساختار درخت
    state.visibleProfiles = profilesRes.data || [];
    state.profileById = {};
    state.childrenOf = {};
    state.visibleProfiles.forEach((p) => {
      state.profileById[p.id] = p;
      if (p.reports_to) (state.childrenOf[p.reports_to] = state.childrenOf[p.reports_to] || []).push(p.id);
    });

    // --- وضعیت فعال/غیرفعال
    state.statusByOperator = {};
    (statusRes.data || []).forEach((r) => { state.statusByOperator[r.operator_id] = r; });

    // --- عملکرد و حقوق
    state.targetsByOperator = {};
    state.rawTargetsByOperator = {};
    (targetsRes.data || []).forEach((r) => {
      const b = (state.targetsByOperator[r.operator_id] = state.targetsByOperator[r.operator_id] || { total: 0, totalSalary: 0, count: 0, lastDate: null, lastDateSort: 0, todayCount: 0 });
      const sortNum = Number(r.report_date_sort) || 0;
      b.total += Number(r.target_count) || 0;
      b.totalSalary += Number(r.daily_salary) || 0;
      b.count += 1;
      if (sortNum > b.lastDateSort) { b.lastDate = r.report_date_jalali; b.lastDateSort = sortNum; }
      if (sortNum === TODAY_SORT) b.todayCount += Number(r.target_count) || 0;
      (state.rawTargetsByOperator[r.operator_id] = state.rawTargetsByOperator[r.operator_id] || []).push(r);
    });

    computeAggregates();

    const totalTeam = state.visibleProfiles.length - 1;
    const grandTotal = state.subtreeTotal[profile.id] || 0;
    const grandTotalSalary = state.subtreeSalary[profile.id] || 0;
    const myActive = state.activeCountBySubtree[profile.id] || 0;

    $('summary-row').innerHTML = `
      <div class="summary-card"><div class="label">جمع کل حقوق تیم</div><div class="value salary">${formatNum(grandTotalSalary)}</div></div>
      <div class="summary-card"><div class="label">جمع کل عملکرد تیم</div><div class="value">${formatNum(grandTotal)}</div></div>
      <div class="summary-card">
        <div class="label">کاربران فعال زیرمجموعه</div>
        <div class="value"><span class="pulse-dot"></span>${formatNum(myActive)}${profile.role === 'team_lead' ? ` <small>از ${formatNum(totalTeam)}</small>` : ''}</div>
      </div>
      <div class="summary-card"><div class="label">کل زیرمجموعه</div><div class="value">${formatNum(totalTeam)}</div></div>
    `;

    // --- ردیف آمار شرکت‌ها
    let companyStatsHtml = '';
    const companyStats = companyRes.data || [];
    if (profile.role === 'team_lead' && scopeRes.data && scopeRes.data.length) {
      // ترتیب و لیست شرکت‌ها از جدول team_lead_company_scope؛ شرکت بدون آمار = ۰
      const countBy = {};
      companyStats.forEach((c) => { countBy[c.company] = c.active_count; });
      companyStatsHtml = companyPillsHtml(scopeRes.data.map((s) => ({ company: s.company, active_count: countBy[s.company] || 0 })));
    } else if (companyStats.length) {
      companyStatsHtml = companyPillsHtml(companyStats);
    }

    // --- گزینه‌های فیلتر شرکت
    const companyOptions = Array.from(new Set(
      state.visibleProfiles
        .map((p) => state.statusByOperator[p.id])
        .filter(Boolean)
        .flatMap((st) => splitCompanies(st.all_companies || st.companies))
    )).sort((a, b) => a.localeCompare(b, 'fa'));

    content.innerHTML = `
      ${companyStatsHtml}
      <div class="filters">
        <input type="search" class="tree-search" id="tree-search" placeholder="جستجوی نام..." aria-label="جستجوی نام">
        ${companyOptions.length ? `
          <select id="company-filter" class="tree-search" aria-label="فیلتر شرکت">
            <option value="">همه‌ی شرکت‌ها</option>
            ${companyOptions.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          </select>` : ''}
      </div>
      <div class="section-label">ساختار زیرمجموعه</div>
      <div id="tree-root"></div>
    `;

    renderTree(profile.id);

    $('tree-search').addEventListener('input', (e) => {
      state.search = e.target.value.trim();
      updateTreeFilter();
    });
    const cf = $('company-filter');
    if (cf) cf.addEventListener('change', (e) => { state.companyFilter = e.target.value; updateTreeFilter(); });
  }

  function companyPillsHtml(list) {
    return `
      <div class="company-stats-row">
        ${list.map((c) => `
          <div class="company-pill" title="${esc(c.company)}">
            <span class="pulse-dot sm"></span><span class="company-name">${esc(c.company)}</span><b>${formatNum(c.active_count)}</b>
          </div>`).join('')}
      </div>
    `;
  }

  // جمع عملکرد، حقوق و تعداد فعال برای هر زیردرخت (یک‌بار محاسبه)
  function computeAggregates() {
    const tot = {}, sal = {}, act = {};
    const visiting = new Set();
    function walk(id) {
      if (tot[id] !== undefined) return;
      if (visiting.has(id)) { tot[id] = 0; sal[id] = 0; act[id] = 0; return; } // محافظ حلقه
      visiting.add(id);
      const own = state.targetsByOperator[id];
      let t = own ? own.total : 0;
      let s = own ? own.totalSalary : 0;
      let a = isFullyActive(state.statusByOperator[id]) ? 1 : 0;
      (state.childrenOf[id] || []).forEach((cid) => { walk(cid); t += tot[cid]; s += sal[cid]; a += act[cid]; });
      tot[id] = t; sal[id] = s; act[id] = a;
      visiting.delete(id);
    }
    state.visibleProfiles.forEach((p) => walk(p.id));
    state.subtreeTotal = tot;
    state.subtreeSalary = sal;
    state.activeCountBySubtree = act;
  }

  function updateTreeFilter() {
    const root = $('tree-root');
    if (!state.search && !state.companyFilter) { renderTree(state.profile.id); return; }
    const q = state.search.toLowerCase();
    let matches = state.visibleProfiles.filter((p) => p.id !== state.profile.id);
    if (q) matches = matches.filter((p) => (p.full_name || '').toLowerCase().includes(q));
    if (state.companyFilter) {
      matches = matches.filter((p) => {
        const st = state.statusByOperator[p.id];
        return st && splitCompanies(st.all_companies || st.companies).includes(state.companyFilter);
      });
    }
    if (matches.length === 0) {
      root.innerHTML = '<div class="empty-state">کسی با این مشخصات پیدا نشد</div>';
      return;
    }
    root.innerHTML = matches.map((p, i) => buildNodeHtml(p.id, i)).join('');
  }

  // اپراتورها: آنلاین‌ها اول (الفبایی)، بعد آفلاین‌ها؛ نودهای غیربرگ دست‌نخورده
  function sortKidsForDisplay(ids) {
    return ids.slice().sort((a, b) => {
      const aLeaf = !(state.childrenOf[a] || []).length;
      const bLeaf = !(state.childrenOf[b] || []).length;
      if (!aLeaf || !bLeaf) return 0;
      const onA = isFullyActive(state.statusByOperator[a]);
      const onB = isFullyActive(state.statusByOperator[b]);
      if (onA !== onB) return onA ? -1 : 1;
      const nA = (state.profileById[a] && state.profileById[a].full_name) || '';
      const nB = (state.profileById[b] && state.profileById[b].full_name) || '';
      return nA.localeCompare(nB, 'fa');
    });
  }

  function renderTree(rootId) {
    const container = $('tree-root');
    const kids = sortKidsForDisplay(state.childrenOf[rootId] || []);
    container.innerHTML = kids.length
      ? kids.map((id, i) => buildNodeHtml(id, i)).join('')
      : '<div class="empty-state">زیرمجموعه‌ای ثبت نشده است</div>';
  }

  function buildNodeHtml(id, idx) {
    const p = state.profileById[id];
    const kids = state.childrenOf[id] || [];
    const isLeaf = kids.length === 0;
    const own = state.targetsByOperator[id];
    const st = state.statusByOperator[id];
    const active = isFullyActive(st);

    const totalLabel = isLeaf ? (own ? formatNum(own.total) : '—') : formatNum(state.subtreeTotal[id]);
    const salaryLabel = isLeaf ? (own ? formatNum(own.totalSalary) : '—') : formatNum(state.subtreeSalary[id]);
    const countLabel = isLeaf ? (own ? `${formatNum(own.count)} روز` : 'بدون رکورد') : `${formatNum(kids.length)} زیرمجموعه`;

    // نقطه‌ی وضعیت فقط برای خودِ اپراتورها؛ سرگروهِ بدون زیرمجموعه هم فلش می‌گیره
    const lead = (isLeaf && p.role === 'operator')
      ? `<span class="leaf-dot"></span><span class="status-dot ${active ? '' : 'inactive'}" title="${active ? 'فعال' : 'غیرفعال'}"></span>`
      : '<span class="chevron">◀</span>';

    const activeBadge = (!isLeaf && p.role === 'team_lead')
      ? `<span class="active-badge"><span class="status-dot"></span>${formatNum(state.activeCountBySubtree[id])} فعال</span>`
      : '';

    const displayCompanies = (st && (st.companies || st.all_companies)) || '';
    const companiesBadge = (isLeaf && displayCompanies)
      ? `<span class="company-pill tiny ${st.companies ? '' : 'inactive-companies'}" title="${st.companies ? 'شرکت‌های فعال' : 'شرکت‌هایی که باهاشون کار کرده (غیرفعال)'}">${esc(displayCompanies)}</span>`
      : '';

    const showToday = isLeaf && own && (state.viewerRole === 'team_lead' || state.viewerRole === 'supervisor');
    const todayBadge = showToday
      ? `<span class="today-count-badge" title="تعداد صدور دقیقاً برای تاریخ امروز">تعداد صدور امروز: ${formatNum(own.todayCount)}</span>`
      : '';
    const lastBadge = (showToday && own.lastDate)
      ? `<span class="last-active-badge" title="آخرین روزی که این کاربر فعالیت داشته">آخرین روز فعالیت: ${esc(own.lastDate)}</span>`
      : '';

    return `
      <div class="tree-node" style="--i:${idx || 0}">
        <div class="tree-row ${isLeaf ? 'clickable-leaf' : ''} role-${esc(p.role)}" data-id="${esc(id)}" data-leaf="${isLeaf}" tabindex="0" role="button" aria-expanded="false">
          ${lead}
          <span class="name">${esc(p.full_name || '—')}</span>
          <span class="tree-role">${esc(ROLE_LABELS[p.role] || p.role)}</span>
          ${activeBadge}${companiesBadge}${todayBadge}${lastBadge}
          <span class="spacer"></span>
          <span class="tree-count">${countLabel}</span>
          <div class="tree-total-group">
            <span class="tree-total">${totalLabel}</span>
            <span class="tree-total salary">${salaryLabel}</span>
          </div>
        </div>
        <div class="${isLeaf ? 'leaf-detail' : 'tree-children'}"><div class="${isLeaf ? 'leaf-detail-inner' : 'tree-children-inner'}"></div></div>
      </div>
    `;
  }

  function buildLeafDetailHtml(id) {
    const rows = (state.rawTargetsByOperator[id] || []).slice()
      .sort((a, b) => (Number(b.report_date_sort) || 0) - (Number(a.report_date_sort) || 0));
    return rows.length ? rowsTableHtml(rows) : '<div class="empty-state">رکوردی برای این فرد ثبت نشده است</div>';
  }

  // یک هندلر مشترک (event delegation) برای کل درخت — لازم نیست بعد از هر رندر دوباره وصل بشه
  function toggleRow(row) {
    const id = row.getAttribute('data-id');
    const isLeaf = row.getAttribute('data-leaf') === 'true';
    const box = row.nextElementSibling;
    if (!box) return;
    const inner = box.firstElementChild;

    if (box.classList.contains('open')) {
      box.classList.remove('open');
      row.classList.remove('open');
      row.setAttribute('aria-expanded', 'false');
      return;
    }

    if (!inner.children.length) {
      if (isLeaf) {
        inner.innerHTML = buildLeafDetailHtml(id);
      } else {
        const kids = sortKidsForDisplay(state.childrenOf[id] || []);
        if (!kids.length) return;
        inner.innerHTML = kids.map((cid, i) => buildNodeHtml(cid, i)).join('');
      }
    }
    box.classList.add('open');
    row.classList.add('open');
    row.setAttribute('aria-expanded', 'true');
  }

  $('content-area').addEventListener('click', (e) => {
    const row = e.target.closest('#tree-root .tree-row');
    if (row) toggleRow(row);
  });
  $('content-area').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('#tree-root .tree-row');
    if (row) { e.preventDefault(); toggleRow(row); }
  });

  // اگر قبلاً لاگین بوده، مستقیم وارد شو
  boot();
})();

</script>
</body>
</html>
